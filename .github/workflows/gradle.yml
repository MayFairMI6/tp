name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v5
      - name: Compile, test, check style, and package
        shell: bash
        run: bash gradlew check shadowJar --warning-mode all
      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash text-ui-test/runtest.sh
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: text-ui-test\runtest.bat
